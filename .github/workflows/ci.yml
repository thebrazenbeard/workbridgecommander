name: ci
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: workbridge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run audit

  windows-build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run audit
      - name: Qualify exact DesktopCommander payload
        shell: powershell
        run: .\\scripts\\qualify-real-payload.ps1
      - name: Parse PowerShell operator scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath .\scripts -Filter '*.ps1' -Recurse | ForEach-Object {
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$null,[ref]$errors)
            if ($errors.Count) { $failed = $true; Write-Error ($_.FullName + ': ' + ($errors | Out-String)) }
          }
          if ($failed) { exit 1 }
